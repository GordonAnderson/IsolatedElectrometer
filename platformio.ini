; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_trinket_m0]
platform = atmelsam
board = adafruit_trinket_m0
framework = arduino

board_build.usb_product = IsoElectrometer
board_vendor = GAA Custom Electronics, LLC

lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    https://github.com/cmaglie/FlashStorage.git
    https://github.com/adafruit/Adafruit_DotStar.git
