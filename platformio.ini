; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_trinket_m0]
platform = atmelsam
board = adafruit_trinket_m0
framework = arduino

board_build.usb_product = IsoElectrometer
board_vendor = GAA Custom Electronics, LLC

lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    https://github.com/cmaglie/FlashStorage.git
    https://github.com/adafruit/Adafruit_DotStar.git

; Test build for an Adafruit QT Py M0 (same ATSAMD21E18, different pins), for bench tests without a
; Trinket M0. The ADC input is hard-wired to PA07 (ADC channel 7) in ADC.cpp, which is pin 7 / A7 / "RX" on
; the QT Py. TRIGIN is pin 3 (A3 / PA05, EXTINT5). The bias DAC is A0 on both boards. There is no DotStar.
; Wire a jumper from A0 (bias DAC) to RX (A7) for a test signal, and touch or drive A3 for a hardware trigger.
[env:adafruit_qtpy_m0]
platform = atmelsam
board = adafruit_qt_py_m0
framework = arduino

board_vendor = GAA Custom Electronics, LLC
build_flags =
    -DNO_DOTSTAR
    -DCUR=A7
    -DADC_PIN=A7
    -DTRIGIN=3

lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    https://github.com/cmaglie/FlashStorage.git
